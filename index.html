    <style>
    .box {
        /* we need this to position the pseudo-element */
        position: relative;
        /* left: -12px;
      
        /* set a fixed size */
        /* width: 6rem; height: 6rem; */
      
        /* this is just to style the content */
        padding: 6px;
        color: white;
        text-align: right;
        width: 100%;
        height: 100%;
        }
      
      .box:before {
        /* we need this to create the pseudo-element */
        content: "";
        display: block;
      
        /* position the triangle in the top right corner */
        position: absolute;
        z-index: 0;
        top: 0;
        left: 40%;
        width: 100%;
        height: 100%;
        /* create the triangle */
        /* width: 0;
        height: 0; */
        border: 250px solid transparent;
        border-top-color: green;
        border-right-color: green;
        }
      
      .content {
        /* position the content above the triangle */
        position: relative;
        z-index: 1;
        width: 100%;
        height: 150px;
        }
      
        .background{
          background-color: lightgreen;
          /* width: 6em; height: 6em; */
